name: Daily TikTok to YouTube Schedule

on:
  schedule:
    # Daily 12:00 UTC = 5:00 PM PKT
    - cron: '0 12 * * *'
  workflow_dispatch: # Manual test button

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Downloader and Uploader
        run: python main.py

      - name: Commit and Push History File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add uploaded_ids.txt
          git commit -m "Auto update: uploaded_ids.txt [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
